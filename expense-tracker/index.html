<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker — Aryan Shresthacharya</title>
<meta name="description" content="Track expenses by category with live charts and CSV export. Data stays on your device.">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#0f1419; --card:#1a2129; --border:#2a333e; --text:#e8eaed; --muted:#8a94a0; --accent:#00d9ff; --danger:#ff6b6b; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:2rem 1rem; display:flex; flex-direction:column; align-items:center; }
  h1 { font-size:1.6rem; font-weight:600; margin-bottom:.3rem; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:1.8rem; }
  .wrap { width:100%; max-width:880px; display:grid; grid-template-columns:1fr 1fr; gap:1.2rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.4rem; }
  .full { grid-column:1 / -1; }
  label { display:block; font-size:.75rem; color:var(--muted); margin:.8rem 0 .3rem; text-transform:uppercase; letter-spacing:.05em; }
  input, select { width:100%; padding:.7rem .9rem; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:.95rem; outline:none; }
  input:focus, select:focus { border-color:var(--accent); }
  .btn { margin-top:1.1rem; width:100%; padding:.8rem; background:var(--accent); color:#06262c; border:none; border-radius:10px; font-weight:600; font-size:.95rem; cursor:pointer; }
  .btn:hover { opacity:.85; }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--muted); margin-top:.6rem; }
  .btn.ghost:hover { border-color:var(--accent); color:var(--accent); opacity:1; }
  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:.8rem; margin-bottom:1rem; }
  .stat { background:var(--bg); border-radius:12px; padding:.9rem; text-align:center; }
  .stat .n { font-size:1.25rem; font-weight:700; color:var(--accent); }
  .stat .l { font-size:.72rem; color:var(--muted); text-transform:uppercase; margin-top:.2rem; }
  .chart-wrap { position:relative; height:230px; }
  ul { list-style:none; max-height:320px; overflow-y:auto; }
  li { display:flex; justify-content:space-between; align-items:center; padding:.65rem .8rem; background:var(--bg); border-radius:10px; margin-bottom:.5rem; }
  li .cat { font-size:.75rem; color:var(--muted); }
  li .amt { font-weight:600; }
  li button { background:none; border:none; color:var(--danger); cursor:pointer; font-size:1rem; padding:.2rem .4rem; }
  .empty { color:var(--muted); text-align:center; padding:1.5rem 0; font-size:.9rem; }
  .footer { color:var(--muted); font-size:.8rem; margin-top:2rem; }
  .footer a { color:var(--accent); text-decoration:none; }
  @media (max-width:720px){ .wrap{grid-template-columns:1fr;} }
</style>
</head>
<body>
<h1>Expense Tracker</h1>
<p class="sub">Your data stays on your device — nothing is uploaded</p>

<div class="wrap">
  <div class="card full">
    <div class="summary">
      <div class="stat"><div class="n" id="totalMonth">$0</div><div class="l">This month</div></div>
      <div class="stat"><div class="n" id="totalAll">$0</div><div class="l">All time</div></div>
      <div class="stat"><div class="n" id="topCat">—</div><div class="l">Top category</div></div>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size:1rem;">Add expense</h3>
    <label for="desc">Description</label>
    <input id="desc" placeholder="e.g. Groceries at Coles">
    <label for="amt">Amount (AUD)</label>
    <input id="amt" type="number" min="0" step="0.01" placeholder="0.00">
    <label for="cat">Category</label>
    <select id="cat">
      <option>Food</option><option>Transport</option><option>Rent</option>
      <option>Uni</option><option>Entertainment</option><option>Shopping</option><option>Other</option>
    </select>
    <label for="date">Date</label>
    <input id="date" type="date">
    <button class="btn" id="add">Add expense</button>
    <button class="btn ghost" id="export">Export CSV</button>
  </div>

  <div class="card">
    <h3 style="font-size:1rem; margin-bottom:.8rem;">By category</h3>
    <div class="chart-wrap"><canvas id="pie" role="img" aria-label="Pie chart of expenses by category"></canvas></div>
  </div>

  <div class="card full">
    <h3 style="font-size:1rem; margin-bottom:.8rem;">Recent expenses</h3>
    <ul id="list"></ul>
    <p class="empty" id="empty">No expenses yet — add your first one above.</p>
  </div>
</div>

<p class="footer">Built by <a href="https://github.com/Aryan39-ai" target="_blank" rel="noopener">Aryan Shresthacharya</a> · localStorage + Chart.js</p>

<script>
const COLORS = ['#00d9ff','#7f77dd','#5dcaa5','#f0997b','#ed93b1','#fac775','#8a94a0'];
const CATS = ['Food','Transport','Rent','Uni','Entertainment','Shopping','Other'];
let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
let chart = null;
document.getElementById('date').value = new Date().toISOString().slice(0,10);

function save() { localStorage.setItem('expenses', JSON.stringify(expenses)); }

function fmt(n) { return '$' + n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }

function render() {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  const sorted = [...expenses].sort((a,b)=> b.date.localeCompare(a.date));
  empty.style.display = sorted.length ? 'none' : 'block';
  sorted.slice(0, 30).forEach(e => {
    const li = document.createElement('li');
    li.innerHTML = `<div><div>${e.desc}</div><div class="cat">${e.cat} · ${e.date}</div></div>
      <div style="display:flex;align-items:center;gap:.5rem;"><span class="amt">${fmt(e.amount)}</span>
      <button title="Delete" aria-label="Delete expense" data-id="${e.id}">✕</button></div>`;
    list.appendChild(li);
  });
  list.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    expenses = expenses.filter(e => e.id !== b.dataset.id); save(); render();
  }));

  const now = new Date().toISOString().slice(0,7);
  const monthTotal = expenses.filter(e=>e.date.startsWith(now)).reduce((s,e)=>s+e.amount,0);
  const allTotal = expenses.reduce((s,e)=>s+e.amount,0);
  document.getElementById('totalMonth').textContent = fmt(monthTotal);
  document.getElementById('totalAll').textContent = fmt(allTotal);

  const byCat = {};
  expenses.forEach(e => byCat[e.cat] = (byCat[e.cat]||0)+e.amount);
  const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('topCat').textContent = top ? top[0] : '—';

  const labels = CATS.filter(c => byCat[c]);
  const data = labels.map(c => byCat[c]);
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('pie'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: labels.map((_,i)=>COLORS[i%COLORS.length]), borderWidth: 0 }]},
    options: { responsive:true, maintainAspectRatio:false,
      plugins: { legend: { position:'bottom', labels: { color:'#8a94a0', boxWidth:12, padding:14 } } } }
  });
}

document.getElementById('add').addEventListener('click', () => {
  const desc = document.getElementById('desc').value.trim();
  const amount = parseFloat(document.getElementById('amt').value);
  const cat = document.getElementById('cat').value;
  const date = document.getElementById('date').value;
  if (!desc || !amount || amount <= 0 || !date) { alert('Please fill in description, a positive amount, and date.'); return; }
  expenses.push({ id: Date.now().toString(36), desc, amount, cat, date });
  save(); render();
  document.getElementById('desc').value = ''; document.getElementById('amt').value = '';
});

document.getElementById('export').addEventListener('click', () => {
  if (!expenses.length) { alert('Nothing to export yet.'); return; }
  const rows = [['Date','Description','Category','Amount']];
  expenses.forEach(e => rows.push([e.date, '"'+e.desc.replace(/"/g,'""')+'"', e.cat, e.amount.toFixed(2)]));
  const csv = rows.map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'expenses.csv'; a.click();
});

render();
</script>
</body>
</html>
