<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer — Aryan Shresthacharya</title>
<meta name="description" content="A clean Pomodoro focus timer with custom durations, sound, and session tracking.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#0f1419; --card:#1a2129; --border:#2a333e; --text:#e8eaed; --muted:#8a94a0; --accent:#00d9ff; --break:#5dcaa5; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1rem; }
  h1 { font-size:1.4rem; font-weight:600; margin-bottom:1.6rem; }
  .modes { display:flex; gap:.5rem; margin-bottom:2rem; }
  .modes button { padding:.55rem 1.2rem; background:var(--card); border:1px solid var(--border); border-radius:24px; color:var(--muted); font-size:.88rem; cursor:pointer; transition:all .2s; }
  .modes button.active { background:var(--accent); border-color:var(--accent); color:#06262c; font-weight:600; }
  .ring-wrap { position:relative; width:280px; height:280px; margin-bottom:2rem; }
  svg { transform:rotate(-90deg); }
  .time { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .time .t { font-size:3.4rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .time .label { color:var(--muted); font-size:.85rem; text-transform:uppercase; letter-spacing:.1em; margin-top:.2rem; }
  .controls { display:flex; gap:.8rem; margin-bottom:2rem; }
  .controls button { padding:.85rem 2rem; border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; border:none; }
  #startPause { background:var(--accent); color:#06262c; min-width:130px; }
  #reset { background:var(--card); border:1px solid var(--border); color:var(--muted); }
  #reset:hover { color:var(--text); border-color:var(--muted); }
  .sessions { color:var(--muted); font-size:.9rem; margin-bottom:1.6rem; }
  .sessions b { color:var(--accent); }
  details { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:.9rem 1.1rem; width:100%; max-width:340px; }
  summary { cursor:pointer; font-size:.9rem; color:var(--muted); }
  .setting { display:flex; justify-content:space-between; align-items:center; margin-top:.9rem; font-size:.88rem; }
  .setting input { width:64px; padding:.4rem; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); text-align:center; }
  .footer { color:var(--muted); font-size:.8rem; margin-top:2rem; }
  .footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<h1>Pomodoro Timer</h1>

<div class="modes">
  <button data-mode="work" class="active">Focus</button>
  <button data-mode="short">Short break</button>
  <button data-mode="long">Long break</button>
</div>

<div class="ring-wrap">
  <svg width="280" height="280" viewBox="0 0 280 280" aria-hidden="true">
    <circle cx="140" cy="140" r="126" fill="none" stroke="#2a333e" stroke-width="10"/>
    <circle id="prog" cx="140" cy="140" r="126" fill="none" stroke="#00d9ff" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="791.7" stroke-dashoffset="0"/>
  </svg>
  <div class="time">
    <div class="t" id="display">25:00</div>
    <div class="label" id="modeLabel">Focus</div>
  </div>
</div>

<div class="controls">
  <button id="startPause">Start</button>
  <button id="reset">Reset</button>
</div>

<p class="sessions">Completed today: <b id="count">0</b> focus sessions</p>

<details>
  <summary>Settings</summary>
  <div class="setting"><span>Focus (minutes)</span><input type="number" id="setWork" value="25" min="1" max="120"></div>
  <div class="setting"><span>Short break</span><input type="number" id="setShort" value="5" min="1" max="60"></div>
  <div class="setting"><span>Long break</span><input type="number" id="setLong" value="15" min="1" max="60"></div>
  <div class="setting"><span>Sound on finish</span><input type="checkbox" id="setSound" checked style="width:auto"></div>
</details>

<p class="footer">Built by <a href="https://github.com/Aryan39-ai" target="_blank" rel="noopener">Aryan Shresthacharya</a></p>

<script>
const CIRC = 2 * Math.PI * 126;
const settings = JSON.parse(localStorage.getItem('pomodoro-settings') || '{"work":25,"short":5,"long":15,"sound":true}');
let mode = 'work', total = settings.work * 60, remaining = total, running = false, tickHandle = null;
let count = parseInt(localStorage.getItem('pomodoro-count-' + new Date().toISOString().slice(0,10)) || '0');

document.getElementById('setWork').value = settings.work;
document.getElementById('setShort').value = settings.short;
document.getElementById('setLong').value = settings.long;
document.getElementById('setSound').checked = settings.sound;
document.getElementById('count').textContent = count;

const display = document.getElementById('display');
const prog = document.getElementById('prog');
const startPause = document.getElementById('startPause');
const modeLabel = document.getElementById('modeLabel');

function fmt(s) { return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }

function draw() {
  display.textContent = fmt(remaining);
  prog.style.strokeDashoffset = CIRC * (1 - remaining/total);
  prog.style.stroke = mode === 'work' ? '#00d9ff' : '#5dcaa5';
  document.title = fmt(remaining) + ' — Pomodoro';
}

function setMode(m) {
  mode = m;
  const mins = m === 'work' ? settings.work : m === 'short' ? settings.short : settings.long;
  total = mins * 60; remaining = total;
  stop();
  modeLabel.textContent = m === 'work' ? 'Focus' : m === 'short' ? 'Short break' : 'Long break';
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  draw();
}

function tick() {
  remaining--;
  draw();
  if (remaining <= 0) {
    stop();
    if (settings.sound) beep();
    if (mode === 'work') {
      count++;
      localStorage.setItem('pomodoro-count-' + new Date().toISOString().slice(0,10), count);
      document.getElementById('count').textContent = count;
      setMode(count % 4 === 0 ? 'long' : 'short');
    } else {
      setMode('work');
    }
  }
}

function start() { running = true; startPause.textContent = 'Pause'; tickHandle = setInterval(tick, 1000); }
function stop() { running = false; startPause.textContent = 'Start'; clearInterval(tickHandle); }

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .2, .4].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.setValueAtTime(.25, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .18);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .2);
    });
  } catch(e){}
}

startPause.addEventListener('click', () => running ? stop() : start());
document.getElementById('reset').addEventListener('click', () => { stop(); remaining = total; draw(); });
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

['setWork','setShort','setLong','setSound'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    settings.work = Math.max(1, parseInt(document.getElementById('setWork').value) || 25);
    settings.short = Math.max(1, parseInt(document.getElementById('setShort').value) || 5);
    settings.long = Math.max(1, parseInt(document.getElementById('setLong').value) || 15);
    settings.sound = document.getElementById('setSound').checked;
    localStorage.setItem('pomodoro-settings', JSON.stringify(settings));
    setMode(mode);
  });
});

draw();
</script>
</body>
</html>
